<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
body{margin:0}
a{color:#061A70}a:hover{color:#010439}
@keyframes sxFloat{from{transform:translateY(-5px)}to{transform:translateY(7px)}}
@keyframes sxGlow{from{opacity:.38}to{opacity:.8}}
@keyframes sxDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes sxGrowY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sxGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sxPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
button{cursor:pointer;transition:transform .15s ease,background-color .2s ease,color .2s ease}
button:active{transform:scale(.96)}
.sx-scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>

<div style="border-radius: 14px; overflow: hidden; background: #010439; color: #FFFFFF; display: flex; flex-direction: column; animation: sxRise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: 0.2s"><img src="/_blob/a074f2a5b3a6fdf514d29742e4f0886a" alt="韩国自由跑的起点拱门" style="width: 169px; height: 124px; object-fit: cover"><div style="padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', 'Noto Sans SC', sans-serif; font-style: italic; font-weight: 700; font-size: 22px; line-height: 23px; color: #C2E541">2025</span><span style="font-size: 14px; line-height: 20px; font-weight: 700">韩国自由跑</span><span style="font-size: 11px; line-height: 16px; color: #C9CEE8">Hangang StyleRun</span></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'up', reminded: false };
}
renderVals() {
const up = this.state.tab === 'up';
const r = this.state.reminded;
return {
isUp: up,
isPast: !up,
upBg: up ? '#FFFFFF' : 'transparent',
upFg: up ? '#010439' : '#FFFFFF',
pastBg: up ? 'transparent' : '#FFFFFF',
pastFg: up ? '#FFFFFF' : '#010439',
reminded: r,
remBg: r ? '#F5F5F5' : '#C2E541',
remFg: r ? '#5E6170' : '#010439',
remLabel: r ? '已设提醒' : '提醒我',
showUp: () => this.setState({ tab: 'up' }),
showPast: () => this.setState({ tab: 'past' }),
toggleRemind: () => this.setState({ reminded: !r })
};
}
}
</script>
